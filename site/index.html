<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>インラインスケート大会情報</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:20px;background:#f7f8fa;color:#17212b}h1{font-size:1.5rem}.item{background:white;border:1px solid #e2e6eb;border-radius:12px;padding:16px;margin:12px 0}a{color:#1768b5}select{padding:9px}small{color:#596575}</style></head><body><h1>インラインスケート大会情報</h1><p>確認・承認済みの大会のみ掲載します。大会終了後は自動的に非表示になります。</p><label>種目 <select id="filter"><option value="">すべて</option><option value="speed">スピード</option><option value="freestyle">フリースタイル</option><option value="hockey">ホッケー</option><option value="other">その他</option></select></label><div id="events">読み込み中…</div><small>参加前に主催者の公式情報をご確認ください。</small><script>
let events=[];
const el=document.getElementById('events');
function todayJST(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function render(){const kind=document.getElementById('filter').value;const shown=events.filter(e=>e.status==='approved'&&e.date_end>=todayJST()&&(!kind||e.category===kind));el.replaceChildren();if(!shown.length){el.textContent='現在、掲載中の大会はありません。';return;}for(const e of shown){const card=document.createElement('div');card.className='item';const h=document.createElement('h2');h.textContent=e.title;card.append(h);const p=document.createElement('p');p.textContent=e.date_start+(e.date_end!==e.date_start?' 〜 '+e.date_end:'')+(e.prefecture?' ・ '+e.prefecture:'');card.append(p);if(e.official_url&&/^https?:\/\//.test(e.official_url)){const a=document.createElement('a');a.href=e.official_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='公式サイトを見る';card.append(a);}el.append(card);}}
document.getElementById('filter').addEventListener('change',render);
fetch('./approved.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('fetch');return r.json()}).then(data=>{events=data;render()}).catch(()=>{el.textContent='大会情報を読み込めませんでした。';});
</script></body></html>
