<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123b46"><title>全国インラインスケート大会情報</title><style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;color:#163b43;background:#f2f6f6}*{box-sizing:border-box}body{margin:0}header{background:#123b46;color:white;padding:42px max(20px,calc((100% - 900px)/2)) 34px}header small{letter-spacing:.15em;color:#a8e1d9}h1{font-size:clamp(1.5rem,4vw,2.4rem);line-height:1.4;margin:12px 0}header p{line-height:1.8;color:#d7e6e8;max-width:650px}main{max-width:940px;margin:auto;padding:24px 20px 50px}.filters{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 24px}label{display:grid;gap:6px;font-weight:600;font-size:.9rem;flex:1;min-width:140px}select,input{font:inherit;background:white;color:#163b43;border:1px solid #b6cbd0;border-radius:8px;padding:12px;min-width:0}#count{font-weight:700}.item{background:white;border:1px solid #d8e3e5;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 3px 10px #123b4606}.item h2{font-size:1.15rem;line-height:1.6;margin:12px 0}.badge{display:inline-block;background:#e2f4ef;color:#155c4a;padding:4px 10px;border-radius:20px;font-size:.8rem;font-weight:700}.meta{line-height:1.8;color:#50686e}a{color:#086d75;text-underline-offset:4px}.official{display:inline-block;font-weight:700;padding:10px 0}.empty{background:white;border:1px dashed #b6cbd0;border-radius:14px;padding:34px 22px;line-height:1.9}.notice{font-size:.85rem;color:#546d73;line-height:1.8;margin-top:28px}footer{border-top:1px solid #d8e3e5;padding-top:20px;font-size:.8rem;color:#627980}button{font:inherit;padding:10px;border:1px solid #b6cbd0;border-radius:8px;background:white;cursor:pointer}@media(max-width:480px){header{padding-top:28px}.filters{gap:12px}.item{padding:18px}}
</style></head><body>
<header><small>INLINE SKATING · JAPAN</small><h1>全国インラインスケート<br>大会情報</h1><p>スピード競技・マラソンを中心に、全国の大会をご案内。<br>人が内容を確認し、掲載を承認した大会だけを表示します。</p></header>
<main><div class="filters"><label>種目<select id="filter"><option value="">すべての種目</option value="speed">スピード（トラック・ロード）</option><option value="marathon">マラソン・ウルトラ</option><option value="freestyle">フリースタイル</option><option value="hockey">インラインホッケー</option><option value="other">その他</option><option value="multi">複合種目</option></select></label><label>開催地<select id="prefecture"><option value="">全国の大会</option></select></label><label>大会名で検索<input id="search" type="search" placeholder="大会名・会場" aria-label="大会名・会場で検索"></label></div>
<p id="count" aria-live="polite"></p><div id="events" aria-live="polite">大会情報を読み込み中…</div>
<p class="notice">日付は日本時間を基準にしています。終了した大会は表示しません。開催日・参加資格・申込締切・開催中止の有無は、参加前に必ず主催者の公式情報をご確認ください。</p><footer>全国インラインスケート大会情報 ｜ 承認済み情報のみ掲載</footer></main>
<script>
let events=[];
const el=document.getElementById('events');
const names={speed:'スピード',marathon:'マラソン・ウルトラ',freestyle:'フリースタイル',hockey:'インラインホッケー',other:'その他',multi:'複合種目'};
function todayJST(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(v=>[v.type,v.value]));return `${p.year}-${p.month}-${p.day}`;}
function dateLabel(date){return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(date+'T12:00:00+09:00'));}
function add(parent,tag,content,cls){const node=document.createElement(tag);node.textContent=content;if(cls)node.className=cls;parent.append(node);return node;}
function render(){const kind=document.getElementById('filter').value,pref=document.getElementById('prefecture').value,q=document.getElementById('search').value.trim().toLocaleLowerCase();const shown=events.filter(e=>e.status==='approved'&&e.date_end>=todayJST()&&(!kind||e.category===kind)&&(!pref||e.prefecture===pref)&&(!q||(e.title+' '+(e.venue||'')).toLocaleLowerCase().includes(q))).sort((a,b)=>a.date_start.localeCompare(b.date_start));el.replaceChildren();document.getElementById('count').textContent=`掲載大会 ${shown.length}件`;if(!shown.length){add(el,'p',events.some(e=>e.date_end>=todayJST())?'条件に合う大会はありません。条件を変えてご確認ください。':'現在、掲載中の大会はありません。新しい大会は、情報の確認・承認が済み次第掲載します。','empty');return;}for(const e of shown){const card=add(el,'article','','item');add(card,'span',names[e.category]||'その他','badge');add(card,'h2',e.title);add(card,'p',dateLabel(e.date_start)+(e.date_end!==e.date_start?' 〜 '+dateLabel(e.date_end):'')+' ・ '+e.prefecture,'meta');if(e.venue)add(card,'p',e.venue,'meta');if(e.registration_deadline)add(card,'p','申込締切：'+dateLabel(e.registration_deadline),'meta');if(/^https?:\/\//.test(e.official_url)){const a=add(card,'a','大会の公式情報を見る ↗','official');a.href=e.official_url;a.target='_blank';a.rel='noopener noreferrer';}}}
for(const id of ['filter','prefecture','search'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);
fetch('./approved.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('fetch');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('data');events=data.filter(e=>e.status==='approved');for(const pref of [...new Set(events.filter(e=>e.date_end>=todayJST()).map(e=>e.prefecture))].sort()){const opt=add(document.getElementById('prefecture'),'option',pref);opt.value=pref;}render()}).catch(()=>{el.replaceChildren();add(el,'p','大会情報を読み込めませんでした。時間をおいて再度お試しください。','empty');const button=add(el,'button','再読み込み');button.onclick=()=>location.reload();});
</script></body></html>
