<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b46"><title>インラインスケート練習会一覧</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;color:#163b43;background:#f2f6f6}*{box-sizing:border-box}body{margin:0}header{background:#123b46;color:white;padding:35px max(20px,calc((100% - 900px)/2))}h1{font-size:clamp(1.5rem,4vw,2.3rem);line-height:1.4}header p{line-height:1.8;color:#d7e6e8}header a{color:#cff6ed}main{max-width:940px;margin:auto;padding:24px 20px 50px}.filters{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 24px}label{display:grid;gap:6px;font-weight:600;font-size:.9rem;flex:1;min-width:140px}select,input{font:inherit;background:white;color:#163b43;border:1px solid #b6cbd0;border-radius:8px;padding:12px;min-width:0}#count{font-weight:700}.item{background:white;border:1px solid #d8e3e5;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 3px 10px #123b4606}.item h2{font-size:1.15rem;line-height:1.6;margin:12px 0}.badge{display:inline-block;background:#e2f4ef;color:#155c4a;padding:4px 10px;border-radius:20px;font-size:.8rem;font-weight:700}.meta{line-height:1.8;color:#50686e}.details{padding-left:1.4em;line-height:1.8}a{color:#086d75;text-underline-offset:4px}.official{display:inline-block;font-weight:700;padding:12px 0}.empty{background:white;border:1px dashed #b6cbd0;border-radius:14px;padding:34px 22px;line-height:1.9}.notice{font-size:.87rem;color:#546d73;line-height:1.8;margin-top:28px}button{font:inherit;padding:10px;border:1px solid #b6cbd0;border-radius:8px;background:white;cursor:pointer}@media(max-width:480px){.item{padding:18px}.filters{gap:12px}}
</style></head><body>
<header><a href="./index.html">← 大会情報へ戻る</a><h1>インラインスケート<br>練習会一覧</h1><p>一般参加できる練習会・合同練習・練習体験を、大会とは分けてご案内します。確認済み・掲載承認済みの情報だけを表示します。</p></header>
<main><div class="filters"><label>種目<select id="discipline"><option value="">すべての種目</option><option value="speed">スピード</option><option value="marathon">ロード・長距離</option><option value="freestyle">フリースタイル</option><option value="hockey">ホッケー</option><option value="other">その他</option><option value="multi">複合種目</option></select></label><label>開催地<select id="prefecture"><option value="">全国の練習会</option></select></label><label>キーワード<input type="search" id="search" placeholder="チーム名・会場" aria-label="チーム名・会場で検索"></label></div>
<p id="count" aria-live="polite"></p><div id="sessions" aria-live="polite">練習会情報を読み込み中…</div>
<p class="notice">掲載の練習会について、参加可能な人数・申込条件・中止・日程変更は主催者の情報を必ず確認してください。クラブの練習予定は、その日時に外部参加できることを保証しません。開催済み・未承認の練習会は表示しません。</p><footer><a href="./index.html">大会情報一覧</a></footer></main>
<script>
let sessions=[];
const output=document.getElementById('sessions');
const labels={speed:'スピード',marathon:'ロード・長距離',freestyle:'フリースタイル',hockey:'ホッケー',other:'その他',multi:'複合種目'};
function todayJST(){const x=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=Object.fromEntries(x.map(y=>[y.type,y.value]));return v.year+'-'+v.month+'-'+v.day;}
function dateLabel(s){return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(s+'T12:00:00+09:00'));}
function add(parent,tag,s,cls){const node=document.createElement(tag);node.textContent=s||'';if(cls)node.className=cls;parent.append(node);return node;}
function safeWebURL(v){try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u:null;}catch{return null;}}
function render(){const cat=document.getElementById('discipline').value,pref=document.getElementById('prefecture').value,q=document.getElementById('search').value.trim().toLocaleLowerCase();const now=todayJST();const found=sessions.filter(s=>s.status==='approved'&&s.date_end>=now&&(!cat||s.category===cat)&&(!pref||s.prefecture===pref)&&(!q||(s.title+' '+(s.venue||'')+' '+(s.organizer||'')).toLocaleLowerCase().includes(q))).sort((a,b)=>a.date_start.localeCompare(b.date_start));output.replaceChildren();document.getElementById('count').textContent='掲載練習会 '+found.length+'件';if(!found.length){add(output,'p',sessions.some(s=>s.status==='approved'&&s.date_end>=now)?'条件に合う練習会はありません。':'現在、掲載承認済みの練習会はありません。開催情報を確認してから順次追加します。','empty');return;}for(const s of found){const card=add(output,'article','','item');add(card,'span',labels[s.category]||'その他','badge');add(card,'h2',s.title);if(s.cancelled)add(card,'p','開催中止（確認済み）','badge');add(card,'p',dateLabel(s.date_start)+(s.date_end!==s.date_start?' 〜 '+dateLabel(s.date_end):'')+' ・ '+s.prefecture,'meta');if(s.venue)add(card,'p',s.venue,'meta');if(s.start_time)add(card,'p','開始：'+s.start_time,'meta');if(s.organizer)add(card,'p',s.organizer,'meta');if(s.registration_note)add(card,'p','参加方法：'+s.registration_note,'meta');if(s.participation_fee)add(card,'p','費用：'+s.participation_fee,'meta');if(s.registration_deadline)add(card,'p','申込締切：'+dateLabel(s.registration_deadline),'meta');if(Array.isArray(s.details)){const list=add(card,'ul','','details');for(const d of s.details)add(list,'li',d);}const link=safeWebURL(s.official_url);if(link){const a=add(card,'a','主催者の案内を見る ↗','official');a.href=link.href;a.target='_blank';a.rel='noopener noreferrer';}}}
for(const id of ['discipline','prefecture','search'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);
fetch('./practices-approved.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('fetch');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('invalid data');sessions=data.filter(e=>e.status==='approved');for(const v of [...new Set(sessions.filter(e=>e.date_end>=todayJST()).map(e=>e.prefecture))].sort()){const o=add(document.getElementById('prefecture'),'option',v);o.value=v;}render()}).catch(()=>{output.replaceChildren();add(output,'p','練習会情報を読み込めませんでした。','empty');const b=add(output,'button','再読み込み');b.onclick=()=>location.reload();});
</script></body></html>
