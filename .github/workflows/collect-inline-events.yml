name: Collect inline skating events (review only)
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:
    inputs:
      replay_closed:
        description: 'Recreate previously closed candidates for testing (max 10)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/collect_events.py'
      - 'events/sources.json'
      - '.github/workflows/collect-inline-events.yml'
permissions:
  contents: read
  issues: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check collector
        run: python -m py_compile scripts/collect_events.py
      - name: Collect candidates
        run: python scripts/collect_events.py
      - name: Create review issues for new candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPLAY_CLOSED: ${{ inputs.replay_closed || 'false' }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          candidates=json.loads(Path('events/candidates.json').read_text())
          existing=subprocess.run(['gh','issue','list','--state','all','--limit','1000','--json','title,state'],capture_output=True,text=True,check=True)
          previous={i['title']:i['state'] for i in json.loads(existing.stdout)}
          titles=set(previous)
          replay=os.getenv('REPLAY_CLOSED','false').lower() == 'true'
          print('Replay closed candidates:',replay)
          print('Candidate records:',len(candidates))
          print('Previously registered titles (including closed):',len(titles))
          count=0
          candidates.sort(key=lambda e: (0 if e.get('category') == 'speed' else 1, e.get('date_start', '')))
          for event in candidates:
              title='[大会候補] '+event['id']+' '+event['date_start']
              if title in titles and (not replay or previous[title].upper() != 'CLOSED'):
                  print('Skip previously reviewed candidate:',title)
                  continue
              if title in titles and replay:
                  print('Recreating closed candidate for verification:',title)
                  title=title+' [再収集テスト]'
                  if title in titles:
                      print('Already replayed:',title)
                      continue
              body='**未承認・自動抽出情報。必ず公式情報と日付を確認してください。**\n\n'+json.dumps(event,ensure_ascii=False,indent=2)+'\n\n承認時は内容を精査し、events/approved.json に手動登録してください。Issueラベルだけでは公開されません。'
              subprocess.run(['gh','issue','create','--title',title,'--body',body],check=True)
              titles.add(title)
              count+=1
              if count>=10: break
          print('Created review issues:',count)
          PY
