name: Collect inline skating events (review only)
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'requirements.txt', 'events/sources.json', '.github/workflows/collect-inline-events.yml']
permissions:
  contents: read
  issues: write
concurrency:
  group: inline-event-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Regression and approval safety tests
        run: python -m unittest discover -s tests -v
      - name: Collect candidates from official and regional sources
        run: python scripts/collect_events.py
      - name: Create pending Issues and report all counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/review_issues.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-report-${{ github.run_id }}
          path: |
            events/candidates.json
            reports/
          retention-days: 90
      - name: Fail visibly if collection never produced a report
        if: always()
        run: test -s reports/collection.json
