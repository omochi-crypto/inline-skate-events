name: Publish approved inline events site
on:
  push:
    branches: [main]
    paths: ['events/approved.json', 'site/**', 'scripts/build_site.py', 'scripts/event_model.py', '.github/workflows/build-inline-events-site.yml']
  workflow_run:
    workflows: ['Approve reviewed inline event']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: inline-events-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'omochi-crypto/inline-skate-events' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate approval audit and build public site
        run: python scripts/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: approved-site-preview
          path: public
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
